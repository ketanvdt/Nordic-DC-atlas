defaults:
  target_crs: "EPSG:3035"
  output_crs: "EPSG:4326"
  study_bbox_4326: [4.5, 54.0, 33.0, 72.5]

exclusions:
  - key: natura2000
    source_url: "https://www.eea.europa.eu/data-and-maps/data/natura-14"
    strategy: "overlap_50"
  - key: protected
    source_url: "https://www.avoindata.fi"
    strategy: "overlap_50"
  - key: floodplain
    source_url: "country_specific"
    strategy: "overlap_50"
  - key: heritage
    source_url: "country_specific"
    strategy: "centroid"
  - key: airport
    source_url: "overpass"
    strategy: "buffer"
    buffer_m: 5000
  - key: airport_ols
    source_url: "country_specific"
    strategy: "buffer"
    buffer_m: 3000
  - key: military
    source_url: "country_specific"
    strategy: "overlap_50"
  - key: steep_slope
    source_url: "copernicus_eu_dem"
    strategy: "overlap_50"
  - key: seveso
    source_url: "https://www.eea.europa.eu/data-and-maps/data/espirs-1"
    strategy: "buffer"
    buffer_m: 500
  - key: water_protected
    source_url: "country_specific"
    strategy: "overlap_50"
  - key: urban_industrial
    source_url: "copernicus_clc_osm"
    strategy: "overlap_50"
  - key: sami_reindeer
    source_url: "sametinget_nve_paliskuntain"
    strategy: "overlap_50"

soft_features:
  - key: dist_substation_400kv_m
  - key: dist_substation_130kv_m
  - key: dist_transmission_line_m
  - key: bidding_zone_price_3y
  - key: grid_capacity_heatmap
  - key: dist_dh_network_m
  - key: dh_readiness_tier
  - key: annual_mean_temp_c
  - key: dist_fiber_m
  - key: dist_surface_water_m
  - key: land_cost_proxy_eur_m2
  - key: skilled_workforce_density
  - key: municipal_receptivity
